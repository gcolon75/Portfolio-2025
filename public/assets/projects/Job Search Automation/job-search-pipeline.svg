<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Automated job search pipeline</title>
  <desc id="d">Five stages run by Claude: find roles on job boards, score fit against guardrails, tailor a resume for strong fits, track every lead, and fill the application form in Chrome. The person reviews the form and clicks Submit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00d9ff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4a9eff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <text x="600" y="78" text-anchor="middle" font-family="Orbitron, Arial, sans-serif" font-size="34" font-weight="700" fill="#00d9ff" letter-spacing="3">AUTOMATED JOB SEARCH</text>
  <text x="600" y="114" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">Claude does the searching, scoring, tailoring, and form filling. A person clicks Submit.</text>

  <g font-family="Inter, Arial, sans-serif" fill="#f1f5f9" text-anchor="middle">
    <g>
      <rect x="40" y="190" width="200" height="150" rx="12" fill="#0d1b2a" stroke="#4a9eff" stroke-width="2"/>
      <text x="140" y="228" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">1  FIND</text>
      <text x="140" y="262" font-size="20" font-weight="600">Search boards</text>
      <text x="140" y="290" font-size="15" fill="#94a3b8">Greenhouse, Lever,</text>
      <text x="140" y="312" font-size="15" fill="#94a3b8">Workday, Ashby</text>
    </g>
    <g>
      <rect x="270" y="190" width="200" height="150" rx="12" fill="#0d1b2a" stroke="#4a9eff" stroke-width="2"/>
      <text x="370" y="228" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">2  SCORE</text>
      <text x="370" y="262" font-size="20" font-weight="600">Fit 1 to 10</text>
      <text x="370" y="290" font-size="15" fill="#94a3b8">against the resume</text>
      <text x="370" y="312" font-size="15" fill="#94a3b8">and the guardrails</text>
    </g>
    <g>
      <rect x="500" y="190" width="200" height="150" rx="12" fill="#0d1b2a" stroke="#4a9eff" stroke-width="2"/>
      <text x="600" y="228" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">3  TAILOR</text>
      <text x="600" y="262" font-size="20" font-weight="600">Resume variant</text>
      <text x="600" y="290" font-size="15" fill="#94a3b8">built for every</text>
      <text x="600" y="312" font-size="15" fill="#94a3b8">lead at fit 7+</text>
    </g>
    <g>
      <rect x="730" y="190" width="200" height="150" rx="12" fill="#0d1b2a" stroke="#4a9eff" stroke-width="2"/>
      <text x="830" y="228" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">4  TRACK</text>
      <text x="830" y="262" font-size="20" font-weight="600">Live tracker</text>
      <text x="830" y="290" font-size="15" fill="#94a3b8">New, Applied,</text>
      <text x="830" y="312" font-size="15" fill="#94a3b8">Interviewing, Trash</text>
    </g>
    <g>
      <rect x="960" y="190" width="200" height="150" rx="12" fill="#0d1b2a" stroke="#4a9eff" stroke-width="2"/>
      <text x="1060" y="228" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">5  AUTOFILL</text>
      <text x="1060" y="262" font-size="20" font-weight="600">Form in Chrome</text>
      <text x="1060" y="290" font-size="15" fill="#94a3b8">filled by Claude,</text>
      <text x="1060" y="312" font-size="15" fill="#94a3b8">stops at Submit</text>
    </g>

    <path d="M240 265H266" stroke="#00d9ff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M470 265H496" stroke="#00d9ff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M700 265H726" stroke="#00d9ff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M930 265H956" stroke="#00d9ff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1060 340V392" stroke="#00d9ff" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g>
      <rect x="866" y="396" width="304" height="80" rx="12" fill="#11261b" stroke="#22c55e" stroke-width="2"/>
      <text x="1018" y="430" font-size="18" font-weight="600">Person reviews, clicks Submit</text>
      <text x="1018" y="456" font-size="15" fill="#94a3b8">no application goes out unseen</text>
    </g>

    <g text-anchor="start">
      <rect x="40" y="396" width="800" height="236" rx="12" fill="#0d1b2a" stroke="#4a9eff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
      <text x="70" y="436" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">GUARDRAILS (EACH USER SETS THEIR OWN)</text>
      <text x="70" y="476" font-size="18"><tspan fill="#00d9ff" font-weight="700">Where  </tspan>remote, or inside a max commute from home</text>
      <text x="70" y="512" font-size="18"><tspan fill="#00d9ff" font-weight="700">Experience  </tspan>matched to the user's level; over-asks get flagged</text>
      <text x="70" y="548" font-size="18"><tspan fill="#00d9ff" font-weight="700">Odds  </tspan>below fit 6 goes to Trash, with the reason kept</text>
      <text x="70" y="584" font-size="18"><tspan fill="#00d9ff" font-weight="700">Rule breaks  </tspan>tagged red, never silently applied to</text>
      <text x="70" y="614" font-size="14" fill="#64748b">Same rules live in the skill and the tracker, so both agree on what counts.</text>
    </g>
  </g>
</svg>
