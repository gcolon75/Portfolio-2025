<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">How five friends outside software adopted the tool</title>
  <desc id="d">Rollout in three steps: a packaged adoption zip, personal setup with each user's own resume and region, and support through questions and video screen shares. Five adopters: two lab workers, a senior project manager, a psychology graduate, and an electrical engineering master's graduate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00d9ff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4a9eff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <text x="600" y="78" text-anchor="middle" font-family="Orbitron, Arial, sans-serif" font-size="34" font-weight="700" fill="#00d9ff" letter-spacing="3">FROM ONE USER TO SIX</text>
  <text x="600" y="114" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#94a3b8">Five friends, none of them software developers, now run their own job search on Claude.</text>

  <g font-family="Inter, Arial, sans-serif" fill="#f1f5f9" text-anchor="middle">
    <g>
      <rect x="70" y="170" width="320" height="170" rx="12" fill="#0d1b2a" stroke="#4a9eff" stroke-width="2"/>
      <text x="230" y="210" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">1  PACKAGE</text>
      <text x="230" y="248" font-size="22" font-weight="600">Adoption zip</text>
      <text x="230" y="280" font-size="16" fill="#94a3b8">skills, tracker, and setup</text>
      <text x="230" y="304" font-size="16" fill="#94a3b8">steps in one download</text>
    </g>
    <g>
      <rect x="440" y="170" width="320" height="170" rx="12" fill="#0d1b2a" stroke="#4a9eff" stroke-width="2"/>
      <text x="600" y="210" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">2  PERSONALIZE</text>
      <text x="600" y="248" font-size="22" font-weight="600">Their resume, their region</text>
      <text x="600" y="280" font-size="16" fill="#94a3b8">own commute zone, experience</text>
      <text x="600" y="304" font-size="16" fill="#94a3b8">level, and target roles</text>
    </g>
    <g>
      <rect x="810" y="170" width="320" height="170" rx="12" fill="#0d1b2a" stroke="#4a9eff" stroke-width="2"/>
      <text x="970" y="210" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">3  SUPPORT</text>
      <text x="970" y="248" font-size="22" font-weight="600">Answer, then show</text>
      <text x="970" y="280" font-size="16" fill="#94a3b8">questions by message, video</text>
      <text x="970" y="304" font-size="16" fill="#94a3b8">screen share when stuck</text>
    </g>
    <path d="M390 255H436" stroke="#00d9ff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M760 255H806" stroke="#00d9ff" stroke-width="2.5" marker-end="url(#arrow)"/>

    <text x="600" y="410" font-size="15" fill="#00d9ff" font-weight="700" letter-spacing="2">5 ADOPTERS ACROSS 4 FIELDS</text>
    <g>
      <rect x="70" y="440" width="196" height="150" rx="12" fill="#11261b" stroke="#22c55e" stroke-width="2"/>
      <circle cx="168" cy="488" r="20" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <text x="168" y="548" font-size="19" font-weight="600">Lab worker</text>
    </g>
    <g>
      <rect x="286" y="440" width="196" height="150" rx="12" fill="#11261b" stroke="#22c55e" stroke-width="2"/>
      <circle cx="384" cy="488" r="20" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <text x="384" y="548" font-size="19" font-weight="600">Lab worker</text>
    </g>
    <g>
      <rect x="502" y="440" width="196" height="150" rx="12" fill="#11261b" stroke="#22c55e" stroke-width="2"/>
      <circle cx="600" cy="488" r="20" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <text x="600" y="548" font-size="19" font-weight="600">Senior project</text>
      <text x="600" y="572" font-size="19" font-weight="600">manager</text>
    </g>
    <g>
      <rect x="718" y="440" width="196" height="150" rx="12" fill="#11261b" stroke="#22c55e" stroke-width="2"/>
      <circle cx="816" cy="488" r="20" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <text x="816" y="548" font-size="19" font-weight="600">Psychology</text>
      <text x="816" y="572" font-size="19" font-weight="600">graduate</text>
    </g>
    <g>
      <rect x="934" y="440" width="196" height="150" rx="12" fill="#11261b" stroke="#22c55e" stroke-width="2"/>
      <circle cx="1032" cy="488" r="20" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <text x="1032" y="548" font-size="19" font-weight="600">EE master's</text>
      <text x="1032" y="572" font-size="19" font-weight="600">graduate</text>
    </g>
    <text x="600" y="630" font-size="15" fill="#64748b">Roles and backgrounds only. No names, resumes, or applications are shown.</text>
  </g>
</svg>
