<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automated Job Search: Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg:#eceef1; --surface:#fff; --surface-2:#f5f6f8; --ink:#1b1f24; --ink-2:#3d4650; --muted:#6b7682;
    --line:#d6dae0; --accent:#a8541f; --good:#26643f; --good-soft:#e4f1e8;
    --warn:#7e5a0c; --warn-soft:#faf0d8; --bad:#9d2b22; --bad-soft:#fae9e7; --info:#2a5388; --info-soft:#e7eefa;
    --shadow:0 1px 2px rgba(20,28,38,.06),0 8px 20px -14px rgba(20,28,38,.3);
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --slab:"Zilla Slab",Georgia,serif;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#15181c; --surface:#1d2126; --surface-2:#23282e; --ink:#e8ebee; --ink-2:#c3cad1; --muted:#8c97a3;
    --line:#313840; --accent:#dd8b4e; --good:#7fc79a; --good-soft:#17281e;
    --warn:#d7ab4e; --warn-soft:#2e2716; --bad:#e98b81; --bad-soft:#331d1b; --info:#85aede; --info-soft:#1a2432;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.7); color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 var(--sans); }
  .demo { background:var(--info-soft); color:var(--info); border-bottom:1px solid var(--line); font-size:13px; }
  .demo div { max-width:860px; margin:0 auto; padding:8px 16px; }
  .demo b { font-weight:600; }
  header { position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--bg) 90%,transparent);
           backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .bar { max-width:860px; margin:0 auto; padding:12px 16px 10px; }
  .row1 { display:flex; align-items:center; gap:12px; }
  h1 { font:700 21px/1.2 var(--slab); margin:0; }
  .conn { margin-left:auto; font:500 11px var(--mono); text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--info); }
  .tabs { display:flex; gap:6px; margin-top:10px; overflow-x:auto; scrollbar-width:none; }
  .tab { flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); border-radius:999px;
         padding:5px 12px; font:500 13px var(--sans); cursor:pointer; display:flex; gap:6px; align-items:center; }
  .tab .n { font:600 11.5px var(--mono); color:var(--muted); }
  .tab[aria-selected="true"] { background:var(--ink); color:var(--surface); border-color:var(--ink); }
  .tab[aria-selected="true"] .n { color:var(--surface); opacity:.75; }
  .tab:focus-visible, .btn:focus-visible, .linkbtn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .search { margin-top:10px; width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:8px 11px; font:14px var(--sans); }
  main { max-width:860px; margin:0 auto; padding:14px 16px 60px; display:grid; gap:10px; }
  .hint { color:var(--muted); font-size:12.5px; margin:0 2px; }
  .rules { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 14px; display:grid; gap:6px; }
  .rules-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .rules h2 { margin:0; font:700 15px var(--slab); }
  .rules dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; }
  .rules dt { font:600 11px var(--mono); text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding-top:2px; }
  .rules dd { margin:0; color:var(--ink-2); }
  .linkbtn { background:none; border:0; color:var(--muted); font:12.5px var(--sans); cursor:pointer; padding:0; text-decoration:underline; margin-left:auto; }
  .meta { color:var(--muted); font-size:12.5px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:13px 14px; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  .card > * { min-width:0; }
  .fit { grid-row:span 3; width:42px; height:42px; border-radius:9px; display:grid; place-items:center; font:600 17px var(--mono); background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); }
  .fit.hi { background:var(--good-soft); color:var(--good); border-color:transparent; }
  .fit.mid { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
  .fit.lo { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
  .title { font-weight:600; font-size:15px; line-height:1.3; } .title .co { color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:2px; }
  .chip { font:600 11px var(--mono); letter-spacing:.03em; padding:2px 7px; border-radius:5px; text-transform:uppercase; }
  .chip.high { background:var(--good-soft); color:var(--good); } .chip.reach { background:var(--warn-soft); color:var(--warn); }
  .chip.bad { background:var(--bad-soft); color:var(--bad); } .chip.wait { background:var(--info-soft); color:var(--info); }
  .gap { color:var(--ink-2); font-size:13px; }
  .gap b { font-weight:600; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-right:4px; }
  .actions { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
  .btn { border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:7px; padding:6px 11px; font:500 13px var(--sans); cursor:pointer; }
  .btn:hover { border-color:var(--muted); }
  .btn.go { background:var(--good); border-color:var(--good); color:var(--surface); }
  .btn.res { background:var(--info-soft); border-color:transparent; color:var(--info); }
  .btn.trash { margin-left:auto; background:transparent; color:var(--bad); border-color:transparent; }
  .btn.trash:hover { background:var(--bad-soft); }
  .pending { font-size:12px; color:var(--muted); font-style:italic; }
  details { grid-column:1 / -1; margin-top:4px; }
  summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
  details p { margin:6px 0 0; font-size:13px; color:var(--ink-2); }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:8px 14px; border-radius:8px; font-size:13px; display:flex; gap:12px; align-items:center; box-shadow:var(--shadow); z-index:20; max-width:92vw; }
  .toast button { background:none; border:0; color:var(--accent); font:600 13px var(--sans); cursor:pointer; }
  .card.filled { border-color:var(--warn); box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 30%,transparent),var(--shadow); }
  .card.broken { border-color:color-mix(in srgb,var(--bad) 55%,transparent); }
  .yourmove { grid-column:1 / -1; margin-top:6px; background:var(--warn-soft); color:var(--warn); border-radius:7px; padding:7px 10px; font-size:13px; font-weight:500; }
  .yourmove b { font-weight:700; }
  @media (max-width:520px) { .btn.trash { margin-left:0; } .rules dl { grid-template-columns:1fr; } }
</style></head><body>
<div class="demo"><div><b>Demo with sample data.</b> Companies are fictional and nothing is saved. In the real version, Claude finds and scores the leads, builds the resumes, and fills the forms; each user runs it with their own resume and rules.</div></div>
<header><div class="bar">
  <div class="row1"><h1>Automated Job Search</h1><span class="conn"><span class="dot"></span>demo</span></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <input class="search" id="q" type="search" placeholder="Search company, role, notes" aria-label="Search jobs">
</div></header>
<main id="list" aria-live="polite"></main>
<div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" id="undoBtn">Undo</button></div>

<script>
(function () {
  "use strict";
  var RESUME_MIN = 7, FIT_MIN = 6;
  var TABS = [
    { key:"new",  label:"New",          statuses:["Not started","Ready to submit"] },
    { key:"app",  label:"Applied",      statuses:["Applied"] },
    { key:"int",  label:"Interviewing", statuses:["Screening","Interviewing","Offer"] },
    { key:"arch", label:"Archived",     statuses:[] },
    { key:"rej",  label:"Rejected",     statuses:["Rejected"] },
    { key:"trash",label:"Trash",        statuses:["Withdrawn"] }
  ];
  // Demo guardrails: "Metro" is the commute zone, "Far" is outside it
  var OK_PLACES = /\bin commute zone\b/i, BAD_PLACES = /\b(min commute|outside zone|travel required)\b/i;
  var REMOTE = /\bremote\b/i, NON_US = /\b(canada|india|uk|europe|emea|mexico|apac)\b/i;
  var YEARS = /\b([2-9]|1\d)\s*(\+|-|to|–)\s*\d*\s*\+?\s*(yrs|years)/i;

  function d(off) { var x = new Date(); x.setDate(x.getDate() + off); return x.toISOString().slice(0, 10); }
  var docs = [
    { id:"1", company:"Contoso Labs", role:"Data Operations Analyst", location:"Remote, US", salaryRange:"$62k to $70k", source:"Greenhouse", fitScore:"8", odds:"High", status:"Ready to submit", autofill:"filled", resume:true, topGap:"No SQL listed on resume; covered by migration scripting work", notes:"Strong match on reconciliation and Excel automation." },
    { id:"2", company:"Fabrikam Health", role:"QA Specialist I", location:"Hybrid, in commute zone", salaryRange:"$58k to $66k", source:"Lever", fitScore:"7", odds:"Reach", status:"Not started", resume:true, topGap:"\"2+ years preferred\"; GMP document control experience closes most of it" },
    { id:"3", company:"Northwind Traders", role:"Operations Coordinator", location:"On-site, in commute zone", salaryRange:"$50k to $56k", source:"Workday", fitScore:"6", status:"Not started", topGap:"Bridge role; light on automation, strong on process" },
    { id:"4", company:"Tailspin Systems", role:"Implementation Analyst", location:"On-site, 70 min commute", salaryRange:"$65k to $75k", source:"Ashby", fitScore:"7", status:"Not started", topGap:"Strong fit, but breaks the commute rule" },
    { id:"5", company:"Adventure Works", role:"Business Systems Analyst", location:"Remote, US", salaryRange:"$68k to $78k", source:"Greenhouse", fitScore:"8", status:"Applied", resume:true, dateApplied:d(-6), nextAction:"Follow up if no response", nextActionDate:d(1) },
    { id:"6", company:"Woodgrove Bank", role:"AI Operations Associate", location:"Hybrid, in commute zone", salaryRange:"$64k to $72k", source:"Workday", fitScore:"9", status:"Interviewing", resume:true, dateApplied:d(-14), nextAction:"Prep interview", nextActionDate:d(2), notes:"Panel round. Bring the reconciliation story with numbers." },
    { id:"7", company:"Litware", role:"Data Migration Analyst", location:"Remote, US", salaryRange:"$60k to $70k", source:"Lever", fitScore:"7", status:"Applied", archived:"yes", resume:true, dateApplied:d(-35) },
    { id:"8", company:"Proseware", role:"Junior Data Engineer", location:"Remote, US", salaryRange:"$80k to $90k", source:"Ashby", fitScore:"6", status:"Rejected", dateApplied:d(-20) },
    { id:"9", company:"Wide World Importers", role:"Senior Analyst, 5+ years", location:"On-site, in commute zone", source:"Greenhouse", fitScore:"4", status:"Withdrawn", notes:"Skipped: asks 5+ years, fit below 6." }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var tab = "new", q = "", lastUndo = null, toastTimer = null;

  function tabOf(r) {
    if (r.archived === "yes" && r.status === "Applied") return "arch";
    for (var i = 0; i < TABS.length; i++) if (TABS[i].statuses.indexOf(r.status) >= 0) return TABS[i].key;
    return "new";
  }
  function fitNum(r) { var n = parseFloat(r.fitScore); return isNaN(n) ? 0 : n; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function breaks(r) {
    var out = [], loc = r.location || "";
    var remoteOk = REMOTE.test(loc) && !NON_US.test(loc);
    if (BAD_PLACES.test(loc)) out.push("Outside commute zone");
    else if (!remoteOk && !OK_PLACES.test(loc)) out.push("Check location");
    var m = YEARS.exec((r.topGap || "") + " " + (r.role || ""));
    if (m && !(r.odds === "Reach" && fitNum(r) >= RESUME_MIN)) out.push("Asks " + m[1] + "+ yrs");
    var f = fitNum(r); if (f && f < FIT_MIN) out.push("Low odds");
    return out;
  }

  function renderTabs() {
    var counts = {}; TABS.forEach(function (t) { counts[t.key] = 0; });
    docs.forEach(function (r) { counts[tabOf(r)]++; });
    var box = $("tabs"); box.textContent = "";
    TABS.forEach(function (t) {
      var b = el("button", "tab"); b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", t.key === tab ? "true" : "false");
      b.appendChild(document.createTextNode(t.label)); b.appendChild(el("span", "n", String(counts[t.key])));
      b.addEventListener("click", function () { tab = t.key; render(); });
      box.appendChild(b);
    });
  }

  function card(r) {
    var filled = r.autofill === "filled" && r.status === "Ready to submit";
    var br = tab === "new" ? breaks(r) : [];
    var c = el("article", "card" + (filled ? " filled" : "") + (br.length ? " broken" : ""));
    var f = fitNum(r);
    var fit = el("div", "fit " + (f >= RESUME_MIN ? "hi" : f >= FIT_MIN ? "mid" : f > 0 ? "lo" : ""), f ? String(f) : "?");
    fit.title = "Fit score"; c.appendChild(fit);
    var t = el("div", "title"); t.appendChild(el("span", "co", r.company)); t.appendChild(document.createTextNode("  " + r.role)); c.appendChild(t);
    var bits = [r.location, r.salaryRange, r.source].filter(Boolean);
    if ((tab === "app" || tab === "arch" || tab === "int") && r.dateApplied) bits.push("applied " + r.dateApplied);
    var meta = el("div", "meta", bits.join("  ·  ")), chips = el("div", "chips");
    if (r.status === "Ready to submit") chips.appendChild(el("span", "chip wait", "Ready to submit"));
    if (tab === "new" && r.odds === "High") chips.appendChild(el("span", "chip high", "High odds"));
    if (tab === "new" && r.odds === "Reach") chips.appendChild(el("span", "chip reach", "Reach"));
    br.forEach(function (b) { chips.appendChild(el("span", "chip bad", b)); });
    if (chips.childNodes.length) meta.appendChild(chips);
    c.appendChild(meta);
    var g = el("div", "gap"); if (r.topGap) { g.appendChild(el("b", null, "Gap")); g.appendChild(document.createTextNode(r.topGap)); } c.appendChild(g);
    if (filled) {
      var ym = el("div", "yourmove"); ym.appendChild(el("b", null, "Your move: "));
      ym.appendChild(document.createTextNode("Claude filled this form in Chrome. Review it, click Submit yourself, then tap Applied here."));
      c.appendChild(ym);
    }
    var a = el("div", "actions");
    if (r.resume) {
      var rb = el("button", "btn res", "Tailored resume"); rb.type = "button";
      rb.addEventListener("click", function () { showToast("In the real version this opens a resume Claude tailored to " + r.company + ".", null, null); });
      a.appendChild(rb);
    } else if (f >= RESUME_MIN && tab === "new") a.appendChild(el("span", "pending", "Resume not built yet, ask Claude"));
    if (tab === "new") a.appendChild(action("✓ Applied", "go", r, { status:"Applied", autofill:"", dateApplied:d(0), nextAction:"Follow up if no response", nextActionDate:d(7) }, "Marked applied"));
    if (tab === "app" || tab === "arch") {
      a.appendChild(action("Got interview", "go", r, { status:"Interviewing", nextAction:"Prep interview", nextActionDate:d(2) }, "Moved to Interviewing"));
      a.appendChild(action("Rejected", "", r, { status:"Rejected", nextAction:"", nextActionDate:"" }, "Marked rejected"));
    }
    if (tab === "app") a.appendChild(action("Archive", "", r, { archived:"yes" }, "Archived"));
    if (tab === "int") a.appendChild(action("Rejected", "", r, { status:"Rejected", nextAction:"", nextActionDate:"" }, "Marked rejected"));
    if (tab === "trash" || tab === "rej") a.appendChild(action("Restore to New", "", r, { status:"Not started", archived:"", nextAction:"Decide: apply or trash", nextActionDate:d(2) }, "Restored"));
    if (tab !== "trash") a.appendChild(action("Skip", "trash", r, { status:"Withdrawn", autofill:"", nextAction:"", nextActionDate:"" }, "Moved to trash"));
    c.appendChild(a);
    if (r.notes || r.nextAction) {
      var det = el("details"); det.appendChild(el("summary", null, "Details"));
      if (r.nextAction) det.appendChild(el("p", null, "Next: " + r.nextAction + (r.nextActionDate ? " (" + r.nextActionDate + ")" : "")));
      if (r.notes) det.appendChild(el("p", null, r.notes));
      c.appendChild(det);
    }
    return c;
  }

  function action(label, cls, r, patch, msg) {
    var b = el("button", "btn " + cls, label); b.type = "button";
    b.addEventListener("click", function () {
      var prev = {}; Object.keys(patch).forEach(function (k) { prev[k] = r[k] == null ? "" : r[k]; r[k] = patch[k]; });
      showToast(msg, r.id, prev); render();
    });
    return b;
  }

  function showToast(text, id, prev) {
    $("toastText").textContent = text; $("toast").hidden = false;
    $("undoBtn").hidden = !id; lastUndo = id ? { id:id, prev:prev } : null;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $("toast").hidden = true; lastUndo = null; }, 5000);
  }
  $("undoBtn").addEventListener("click", function () {
    if (!lastUndo) return; var u = lastUndo; lastUndo = null; $("toast").hidden = true;
    var r = docs.filter(function (x) { return x.id === u.id; })[0]; if (r) Object.keys(u.prev).forEach(function (k) { r[k] = u.prev[k]; });
    render();
  });

  var rulesOpen = true;
  function rulesPanel(nBroken, nReady) {
    var b = el("section", "rules"); b.setAttribute("aria-label", "Search rules");
    var head = el("div", "rules-head"); head.appendChild(el("h2", null, "Search rules"));
    var stat = []; if (nReady) stat.push(nReady + " ready to submit"); if (nBroken) stat.push(nBroken + " breaking the rules");
    if (stat.length) head.appendChild(el("span", "meta", stat.join("  ·  ")));
    var tog = el("button", "linkbtn", rulesOpen ? "Hide" : "Show"); tog.type = "button";
    tog.addEventListener("click", function () { rulesOpen = !rulesOpen; render(); });
    head.appendChild(tog); b.appendChild(head);
    if (rulesOpen) {
      var dl = el("dl");
      [["Where", "Remote US, or on-site/hybrid inside your commute zone. 45 min max commute from home."],
       ["Experience", "Entry level: 0 to 1 year required. Any range that starts at 2+ years is out. \"2+ preferred\" only as a Reach at fit 7+."],
       ["Odds", "Fit 6+ to stay in New. Fit 7+ gets a tailored resume. Bridge jobs are fine if they clear both rules above."],
       ["Apply", "Claude fills forms in Chrome while you watch. You click Submit, then tap ✓ Applied."]].forEach(function (p) {
        dl.appendChild(el("dt", null, p[0])); dl.appendChild(el("dd", null, p[1]));
      });
      b.appendChild(dl);
    }
    return b;
  }

  function render() {
    renderTabs();
    var ql = q.trim().toLowerCase();
    var rows = docs.filter(function (r) {
      if (tabOf(r) !== tab) return false;
      return !ql || [r.company, r.role, r.notes, r.topGap, r.location].join(" ").toLowerCase().indexOf(ql) >= 0;
    }).sort(function (a, b) {
      var fa = a.autofill === "filled" ? 1 : 0, fb = b.autofill === "filled" ? 1 : 0; if (fa !== fb) return fb - fa;
      var ra = a.status === "Ready to submit" ? 1 : 0, rb = b.status === "Ready to submit" ? 1 : 0; if (ra !== rb) return rb - ra;
      return fitNum(b) - fitNum(a);
    });
    var box = $("list"); box.textContent = "";
    if (tab === "new") {
      box.appendChild(rulesPanel(rows.filter(function (r) { return breaks(r).length; }).length, rows.filter(function (r) { return r.status === "Ready to submit"; }).length));
      if (rows.length) box.appendChild(el("p", "hint", "Ready to submit first, then best fit. Red tags mean a lead breaks a rule: skip it or restore on purpose."));
    }
    if (tab === "arch" && rows.length) box.appendChild(el("p", "hint", "Applied a while back with no reply. Still counts, just out of your way."));
    if (tab === "trash" && rows.length) box.appendChild(el("p", "hint", "Skipped jobs and passes, with the reason in Details. Restore anything you change your mind on."));
    if (!rows.length) box.appendChild(el("div", "empty", tab === "new" ? "No open leads. In the real version, ask Claude to run a hunt." : "Nothing here."));
    rows.forEach(function (r) { box.appendChild(card(r)); });
  }

  $("q").addEventListener("input", function () { q = this.value; render(); });
  render();
})();
</script>
</body></html>
